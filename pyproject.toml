[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vachan"
version = "0.2.0"
description = "Listens to Hindi/English sermons, detects Bible references and shows the verse for live streams."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Jitesh" }]
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["vachan*"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["skills"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.black]
line-length = 110
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
