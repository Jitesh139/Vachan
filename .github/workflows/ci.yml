name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest==9.1.1 ruff==0.17.0 black==26.10.1
      - name: Lint
        run: |
          ruff check .
          black --check .
      - name: Build Bible database
        run: python scripts/download_bibles.py
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q
